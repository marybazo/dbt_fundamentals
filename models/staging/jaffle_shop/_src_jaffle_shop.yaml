sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after: {count: 12, period: hour }
        error_after: {count: 11, period: day}
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        freshness: null
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: orders
        freshness: null
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
