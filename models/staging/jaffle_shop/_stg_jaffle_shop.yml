models:
  - name: stg_jaffle_shop__customers
    description: The grain is 1 unique customer per row
    columns:
    - name: customer_id
      description: primary key
      data_tests:
        - unique
        - not_null
  - name: stg_jaffle_shop__orders
    description: The grain is 1 unique order per row
    columns:
    - name: order_id
      description: primary key
      data_tests:
        - unique
        - not_null
    - name: status
      description: "{{ doc('order_status')}}"
      data_tests:
        - accepted_values:
            values:
              - completed
              - shipped
              - returned
              - placed
              - return_pending
    - name: customer_id
      data_tests:
        - relationships:
            field: customer_id
            to: ref('stg_jaffle_shop__customers')